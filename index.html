<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, world</title>
  <meta name="description" content="Coming soon.">
  <style>
    :root {
      --bg: #f7f7f5;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --accent: #2f6feb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111213; --fg: #ececec; --muted: #9a9a9a; --accent: #6ea0ff; }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
    }
    main { text-align: center; max-width: 36rem; }
    h1 { font-size: clamp(2.5rem, 8vw, 4.5rem); letter-spacing: -0.03em; line-height: 1.05; }
    h1 span { color: var(--accent); }
    p { margin-top: 1rem; color: var(--muted); font-size: 1.125rem; }
    footer { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Hello, <span>world</span>.</h1>
    <p>Something new is on the way. Check back soon.</p>
  </main>
  <footer>&copy; <span id="y">2026</span></footer>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
